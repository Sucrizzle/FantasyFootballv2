name: Deploy FantasyFootballManager

on:
  push:
    branches:
      - development
      - main
    paths:
      - "Lambda/Bronze/BronzeBackfill.py"
      - "Lambda/Silver/Silver.py"
      - "Lambda/Silver/queries/*"
      - "Lambda/Gold/Gold.py"
      - "Lambda/Gold/queries/*"
      - "Lambda/Config/Config.py"
      - "Lambda/DraftBoard/DraftBoard.py"
      - "Lambda/DraftBoard/queries/*"
      - "Lambda/DraftState/DraftState.py"
      - "Lambda/DraftUrgency/DraftUrgency.py"
      - "Datasets/Mappings/*.csv"
      - ".github/workflows/deploy-FantasyFootballManager.yml"

permissions:
  id-token: write # required for OIDC federation with AWS - no stored access keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BACKFILL_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-bronze-backfill' || 'fantasy-football-bronze-backfill-dev' }}
      SILVER_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-silver' || 'fantasy-football-silver-dev' }}
      GOLD_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-gold' || 'fantasy-football-gold-dev' }}
      CONFIG_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-config' || 'fantasy-football-config-dev' }}
      DRAFT_BOARD_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-draft-board' || 'fantasy-football-draft-board-dev' }}
      DRAFT_STATE_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-draft-state' || 'fantasy-football-draft-state-dev' }}
      DRAFT_URGENCY_FUNCTION_NAME: ${{ github.ref_name == 'main' && 'fantasy-football-draft-urgency' || 'fantasy-football-draft-urgency-dev' }}
      MAPPINGS_BUCKET: ${{ github.ref_name == 'main' && 'fantasy-football-808943963151-ca-central-1-an' || 'fantasy-football-dev-808943963151-ca-central-1-an' }}
    steps:
      - uses: actions/checkout@v4

      # Separate IAM roles per environment, tag-scoped (not name-scoped) -
      # so this deploy role/policy pair didn't need any changes when the
      # Lambda function itself was renamed, only FUNCTION_NAME below did.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'main' && secrets.AWS_DEPLOY_ROLE_ARN_PROD || secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ca-central-1

      - name: Upload Mapping Files
        run: |
          aws s3 cp Datasets/Mappings/ \
            "s3://$MAPPINGS_BUCKET/mappings/" \
            --recursive --exclude "*" --include "*.csv"

      - name: Upload Silver query files
        run: |
          aws s3 cp Lambda/Silver/queries/ \
            "s3://$MAPPINGS_BUCKET/silver/queries/" --recursive

      - name: Upload Gold query files
        run: |
          aws s3 cp Lambda/Gold/queries/ \
            "s3://$MAPPINGS_BUCKET/gold/queries/" --recursive

      - name: Upload DraftBoard query files
        run: |
          aws s3 cp Lambda/DraftBoard/queries/ \
            "s3://$MAPPINGS_BUCKET/draft-board/queries/" --recursive

      - name: Package function code
        run: |
          cd Lambda/Bronze
          zip function.zip BronzeBackfill.py

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$BACKFILL_FUNCTION_NAME" \
            --zip-file fileb://Lambda/Bronze/function.zip

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated --function-name "$BACKFILL_FUNCTION_NAME"

      - name: Package Silver function code
        run: |
          cd Lambda/Silver
          zip function.zip Silver.py

      - name: Deploy Silver to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$SILVER_FUNCTION_NAME" \
            --zip-file fileb://Lambda/Silver/function.zip

      - name: Wait for Silver update to finish
        run: |
          aws lambda wait function-updated --function-name "$SILVER_FUNCTION_NAME"

      - name: Package Gold function code
        run: |
          cd Lambda/Gold
          zip function.zip Gold.py

      - name: Deploy Gold to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$GOLD_FUNCTION_NAME" \
            --zip-file fileb://Lambda/Gold/function.zip

      - name: Wait for Gold update to finish
        run: |
          aws lambda wait function-updated --function-name "$GOLD_FUNCTION_NAME"

      - name: Package Config function code
        run: |
          cd Lambda/Config
          zip function.zip Config.py

      - name: Deploy Config to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$CONFIG_FUNCTION_NAME" \
            --zip-file fileb://Lambda/Config/function.zip

      - name: Wait for Config update to finish
        run: |
          aws lambda wait function-updated --function-name "$CONFIG_FUNCTION_NAME"

      - name: Package DraftBoard function code
        run: |
          cd Lambda/DraftBoard
          zip function.zip DraftBoard.py

      - name: Deploy DraftBoard to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DRAFT_BOARD_FUNCTION_NAME" \
            --zip-file fileb://Lambda/DraftBoard/function.zip

      - name: Wait for DraftBoard update to finish
        run: |
          aws lambda wait function-updated --function-name "$DRAFT_BOARD_FUNCTION_NAME"

      - name: Package DraftState function code
        run: |
          cd Lambda/DraftState
          zip function.zip DraftState.py

      - name: Deploy DraftState to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DRAFT_STATE_FUNCTION_NAME" \
            --zip-file fileb://Lambda/DraftState/function.zip

      - name: Wait for DraftState update to finish
        run: |
          aws lambda wait function-updated --function-name "$DRAFT_STATE_FUNCTION_NAME"

      - name: Package DraftUrgency function code
        run: |
          cd Lambda/DraftUrgency
          zip function.zip DraftUrgency.py

      - name: Deploy DraftUrgency to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DRAFT_URGENCY_FUNCTION_NAME" \
            --zip-file fileb://Lambda/DraftUrgency/function.zip

      - name: Wait for DraftUrgency update to finish
        run: |
          aws lambda wait function-updated --function-name "$DRAFT_URGENCY_FUNCTION_NAME"

